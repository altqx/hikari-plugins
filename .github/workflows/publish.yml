name: Publish

on:
  push:
    branches: [main]
    paths: [plugins/**, approvals/**, featured.json, config/**, registry/**, schemas/**]
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:
    inputs:
      backfill:
        description: Upload published versions that R2 lacks
        type: boolean
        default: false

permissions:
  contents: write
  pull-requests: write
  issues: write

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Backfill
        if: inputs.backfill
        run: python -m registry backfill --upload r2:hikari-marketplace
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      - name: Publish
        id: publish
        run: python -m registry publish --upload r2:hikari-marketplace
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          MARKETPLACE_MINISIGN_KEY: ${{ secrets.MARKETPLACE_MINISIGN_KEY }}
          MARKETPLACE_MINISIGN_PASSWORD: ${{ secrets.MARKETPLACE_MINISIGN_PASSWORD }}
      - name: Save the published state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add published
          if ! git diff --cached --quiet; then
            git commit -m "Publish: update the published state"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
      - name: Tell the site
        if: ${{ !cancelled() && steps.publish.outputs.index-serial != '' }}
        run: python -m registry notify-site --serial "$SERIAL"
        env:
          SERIAL: ${{ steps.publish.outputs.index-serial }}
          MARKETPLACE_DISPATCH_TOKEN: ${{ secrets.MARKETPLACE_DISPATCH_TOKEN }}
