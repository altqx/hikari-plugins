name: Publish

on:
  push:
    branches: [main]
    paths: [plugins/**, approvals/**, featured.json, config/**, registry/**, schemas/**]
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  issues: write

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      # Until the Cloudflare side is confirmed: the throwaway test key, and a local folder instead of R2.
      - name: Publish
        run: python -m registry publish --test-key --upload local:out/site
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Save the published state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add published
          if ! git diff --cached --quiet; then
            git commit -m "Publish: update the published state"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: site
          path: out/site
          if-no-files-found: ignore
